name: Publish verified Tandem testing downloads
on:
  push:
    branches: [main]
    paths: ['distribution/manifest.json', '.github/workflows/publish-testing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tandem-testing-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify and stage approved binary assets
        run: python3 distribution/verify.py
      - name: Publish a testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=tandem-v0.5.14
          existing=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo "Refusing to replace published downloads." >&2
            exit 1
          elif [ "$existing" = true ]; then
            gh release edit "$tag" --notes-file TESTING.md
          elif [ -z "$existing" ]; then
            gh release create "$tag" --draft --prerelease --title "Tandem 0.5.14 — Windows and Android testing" --notes-file TESTING.md
          else
            echo "Unknown release state; refusing to modify it." >&2
            exit 1
          fi
          gh release upload "$tag" public-assets/* --clobber
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          expected={p.name:p.stat().st_size for p in pathlib.Path('public-assets').iterdir()}
          actual=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/tandem-v0.5.14']))
          assets={x['name']:x['size'] for x in actual['assets']}
          assert assets==expected,(assets,expected)
          print('All uploaded asset names and sizes match the verified local files.')
          PY
          gh release edit "$tag" --draft=false --prerelease
